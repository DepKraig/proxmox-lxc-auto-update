# lxc-auto-update.conf
#
# Copy this file to /etc/lxc-auto-update.conf and edit the values below.
# This file is sourced by lxc-auto-update.sh - do NOT rename variables.
#
#   sudo cp config.example.conf /etc/lxc-auto-update.conf
#   sudo nano /etc/lxc-auto-update.conf
#
# This file can contain no values at all (just override what you need) -
# anything you don't set here falls back to the script's built-in default.

# Where alert/summary emails get sent
EMAIL_TO="you@example.com"

# The "From" address. If relaying through Gmail via msmtp, this MUST match
# the Gmail account you authenticated as.
EMAIL_FROM="you@example.com"

# CTIDs to never touch (space separated). Example: EXCLUDE_CTIDS=(100 105)
EXCLUDE_CTIDS=()

# Seconds to wait for a container to come back up and respond after reboot
# before it's considered failed and rolled back.
RESTART_TIMEOUT=120
RESTART_POLL_INTERVAL=5

# How many days to keep pre-update snapshots before pruning old ones
SNAPSHOT_RETENTION_DAYS=14

# For containers whose storage does NOT support snapshots (e.g. plain "dir"
# storage), the script automatically falls back to vzdump backup/restore
# instead. This is the Proxmox storage the backups get written to - must
# have "backup" content enabled (the default "local" storage usually does).
BACKUP_STORAGE="local"
BACKUP_RETENTION_DAYS=14

# Notes attached to each backup (visible in the Proxmox GUI's Backups tab).
# Supports {{guestname}}, {{node}}, {{vmid}}, {{cluster}}.
BACKUP_NOTES_TEMPLATE="[lxc-auto-update] {{guestname}} (CT {{vmid}}) on {{node}} - pre-update backup"

# Set to 1 to log what the script would do without changing anything
DRY_RUN=0
